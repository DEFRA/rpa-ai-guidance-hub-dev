services:
  rpa-ai-guidance-hub-search:
    build:
      target: development
      context: ../repos/rpa-ai-guidance-hub-search
    ports:
      - 8086:8086
    links:
      - "floci:floci"
      - "mongodb:mongodb"
    depends_on:
      floci:
        condition: service_healthy
      # Not service_started: the app pings Mongo during FastAPI lifespan
      # startup and exits if it is unreachable.
      mongodb:
        condition: service_healthy
    env_file:
      - path: ../.env
        required: false
    environment:
      PYTHON_ENV: development # enables uvicorn hot reload
      PORT: 8086 # hard-set: ${PORT:-...} would collide with the API's PORT
      HOST: 0.0.0.0
      # Hard-set, not ${VAR:-default}: ../.env holds host-oriented values that would win.
      MONGO_URI: mongodb://mongodb:27017/
      FLOCI_ENDPOINT_URL: http://floci:4566
      AWS_ENDPOINT_URL: http://floci:4566
      # Sections, chunk sets and index builds, made by
      # compose/floci/start.d/10-setup-resources.sh.
      SEARCH_STORE_S3_BUCKET: ${SEARCH_STORE_S3_BUCKET:-rpa-ai-guidance-hub-search-store}
      SEARCH_INDEXING_SQS_QUEUE_URL: http://floci:4566/000000000000/rpa_ai_guidance_hub_search_indexing
      SEARCH_INDEX_SYNC_SQS_QUEUE_URL: http://floci:4566/000000000000/rpa_ai_guidance_hub_search_index_sync.fifo
    volumes:
      - ../repos/rpa-ai-guidance-hub-search/app:/home/nonroot/app
    develop:
      watch:
        - action: rebuild
          path: ../repos/rpa-ai-guidance-hub-search/pyproject.toml
          target: /home/nonroot/pyproject.toml
    networks:
      - rpa-ai-guidance-hub
